<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小鲸鱼 · QQ Bot 管理面板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--panel:#161b22;--panel2:#1c2230;--line:#293040;
  --txt:#e6edf3;--dim:#8b949e;--acc:#4a9eff;--ok:#3fb950;--warn:#d29922;--err:#f85149;
}
body{background:var(--bg);color:var(--txt);font:14px/1.6 "Microsoft YaHei","Segoe UI",sans-serif;display:flex;height:100vh;overflow:hidden}
aside{width:190px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.logo{padding:18px 16px;font-weight:700;font-size:15px;border-bottom:1px solid var(--line)}
.logo small{display:block;color:var(--dim);font-weight:400;font-size:11px;margin-top:2px}
nav{padding:10px 8px;flex:1}
nav a{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:var(--dim);text-decoration:none;cursor:pointer;margin-bottom:2px;font-size:13.5px}
nav a:hover{background:var(--panel2);color:var(--txt)}
nav a.on{background:#1f6feb22;color:var(--acc);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--err);flex:none}
.dot.g{background:var(--ok)}
main{flex:1;overflow:auto;padding:20px 24px}
h2{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
h2 .sub{font-size:12px;color:var(--dim);font-weight:400}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .k{color:var(--dim);font-size:12px;margin-bottom:4px}
.stat .v{font-size:16px;font-weight:600;display:flex;align-items:center;gap:7px}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;font-family:inherit}
button:hover{border-color:var(--acc);color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#06121f;font-weight:600}
button.primary:hover{filter:brightness(1.1);color:#06121f}
button.danger:hover{border-color:var(--err);color:var(--err)}
button:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{background:#0b0f16;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:9px 11px;font:inherit;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
textarea{resize:vertical;line-height:1.7;font-size:13px}
label.f{display:block;font-size:12px;color:var(--dim);margin:10px 0 5px}
.alertbar{background:#7a2020;color:#fff;padding:10px 16px;font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:center;border-bottom:1px solid #a33}
.alertbar b{color:#ffd7d7}
.dot.bad{background:#e35}
.qrbox{background:#fff;padding:10px;border-radius:12px;display:inline-block}
.toast{position:fixed;right:20px;bottom:20px;background:#1f6feb;color:#fff;padding:11px 16px;border-radius:9px;opacity:0;transform:translateY(10px);transition:.22s;z-index:99;max-width:420px;font-size:13px}
.toast.show{opacity:1;transform:none}
.toast.err{background:#8b1a1a}
.toast.ok{background:#1a7f37}
/* memes */
.meme-wrap{display:grid;grid-template-columns:220px 1fr;gap:14px;height:calc(100vh - 150px)}
.cats{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;padding:6px}
.cats .c{padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
.cats .c:hover{background:var(--panel2);color:var(--txt)}
.cats .c.on{background:#1f6feb22;color:var(--acc);font-weight:600}
.cats .c span{font-size:11px;opacity:.7}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;display:flex;flex-direction:column}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#0b0f16;border:1px solid var(--line);cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .del{position:absolute;top:3px;right:3px;background:#000a;color:#fff;border:none;border-radius:6px;width:20px;height:20px;line-height:1;padding:0;font-size:13px;opacity:0;transition:.15s}
.thumb:hover .del{opacity:1}
.drop{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--dim);font-size:13px;margin-bottom:8px}
.drop.hot{border-color:var(--acc);color:var(--acc);background:#1f6feb11}
/* groups */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:10px}
.gcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.gcard:hover{border-color:var(--acc)}
.gcard.on{border-color:var(--acc);background:#1f6feb15}
.gname{font-weight:600;margin-bottom:2px}
.gmeta{color:var(--dim);font-size:12px}
.grole{color:var(--acc);font-size:11px;margin-top:4px}
.mtab{margin-top:8px;max-height:calc(100vh - 420px);overflow:auto}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line)}
.mrow:last-child{border:none}
.mname{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow button{padding:5px 9px;font-size:12px}
.tag{background:#1f6feb33;color:var(--acc);border-radius:5px;padding:1px 6px;font-size:11px;margin-left:4px}
/* tokens */
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:12px;overflow-x:auto;padding-bottom:16px}
.bar{flex:1;min-width:14px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:120px;position:relative}
.bar i{display:block;width:100%;background:linear-gradient(180deg,#4a9eff,#1f6feb);border-radius:3px 3px 0 0;min-height:2px}
.bar b{position:absolute;bottom:-15px;font-size:9px;color:var(--dim);white-space:nowrap;font-weight:400}
.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl th{color:var(--dim);font-weight:400;font-size:12px}
/* params */
.prow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border:none}
.plabel{font-size:13px}
.pinput{width:280px;flex:none}
/* logs */
pre.log{background:#0b0f16;border:1px solid var(--line);border-radius:10px;padding:12px;font:12px/1.5 Consolas,monospace;color:#c9d1d9;white-space:pre-wrap;word-break:break-all;max-height:calc(100vh - 230px);overflow:auto}
.feed-item{border-bottom:1px solid var(--line);padding:10px 0}
.feed-item:last-child{border:none}
.feed-item .meta{color:var(--dim);font-size:12px;margin-bottom:4px}
.feed-item .body{white-space:pre-wrap;font-size:13px}
.hint{color:var(--dim);font-size:12px;margin-top:6px}
.hidden{display:none!important}
img.qr{width:240px;height:240px;image-rendering:pixelated;background:#fff;border-radius:10px;padding:8px}
</style>
</head>
<body>
<aside>
  <div class="logo">小鲸鱼 · QQ Bot<small>本地管理面板</small></div>
  <nav id="nav">
    <a data-t="home" class="on">🏠 概览</a>
    <a data-t="meme">🖼 表情包</a>
    <a data-t="persona">🧠 人格</a>
    <a data-t="model">⚙️ 模型</a>
    <a data-t="groups">👥 群管理</a>
    <a data-t="proactive">💬 主动聊天</a>
    <a data-t="memory">🧩 长期记忆</a>
    <a data-t="extras">🧰 扩展插件</a>
    <a data-t="voice">🔊 语音</a>
    <a data-t="sing">🎤 唱歌</a>
    <a data-t="tokens">📊 Token 用量</a>
    <a data-t="params">🎛 参数调整</a>
    <a data-t="qzone">🌌 QQ空间</a>
    <a data-t="monitor">🩺 掉线监控</a>
    <a data-t="log">📜 日志</a>
  </nav>
  <div style="padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)">
    <div class="row" style="gap:6px"><span class="dot" id="dotBot"></span><span id="sideState">检查中…</span></div>
    <div class="row" style="gap:6px;margin-top:8px;justify-content:space-between">
      <span id="sideUser" style="font-size:11px"></span>
      <a href="#" onclick="doLogout();return false" style="font-size:11px;color:#8b98a5;text-decoration:none">退出登录</a>
    </div>
  </div>
</aside>
<div id="alertBar" class="alertbar" style="display:none" onclick="go('monitor')"></div>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const api = async (p,opt={})=>{
  const r = await fetch(p, opt);
  if(r.status===401){ location.replace('/login.html'); throw new Error('需要登录'); }
  if(!r.ok && r.status!==200){ let t=''; try{t=(await r.json()).message||''}catch(e){} throw new Error(t||('HTTP '+r.status)); }
  return r.json();
};
const post = (p,b)=>api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});
async function doLogout(){
  try{ await post('/api/auth/logout',{}); }catch(e){}
  location.replace('/login.html');
}
(async()=>{ try{ const d=await api('/api/auth/whoami'); $('#sideUser').textContent='👤 '+(d.username||''); }catch(e){} })();
let toastTimer;
function toast(msg,type=''){
  const t=$('#toast'); t.textContent=msg; t.className='toast show '+type;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.className='toast '+type,3200);
}
const esc = s => (s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- 概览 ---------------- */
function viewHome(){
  $('#main').innerHTML = `
  <h2>概览 <span class="sub" id="clock"></span></h2>
  <div class="grid2" style="margin-bottom:14px">
    <div class="stat"><div class="k">AstrBot（<span id="pAstr">6185</span>）</div><div class="v"><span class="dot" id="d1"></span><span id="v1">—</span></div></div>
    <div class="stat"><div class="k">SnowLuma（<span id="pSl">5099</span>）</div><div class="v"><span class="dot" id="d2"></span><span id="v2">—</span></div></div>
    <div class="stat"><div class="k">QQ 登录</div><div class="v"><span class="dot" id="d3"></span><span id="v3">—</span></div></div>
    <div class="stat"><div class="k">宿主程序 / 监听器</div><div class="v"><span class="dot" id="d4"></span><span id="v4">—</span></div></div>
  </div>
  <div class="card" id="gameCard">
    <div class="row" style="justify-content:space-between">
      <b>🎮 游戏模式</b>
      <span class="hint" id="gmState">—</span>
    </div>
    <div class="hint" style="margin-top:8px">打开后立刻停掉所有吃显存/内存的东西：肥鱼语音、CosyVoice2、GPT-SoVITS、RVC 翻唱残留，并把语音与唱歌总开关关掉（改的是插件读的那份配置，下一条消息就生效）。开着时每 30 秒还会再扫一遍，谁偷偷起来就再按下去。</div>
    <div class="row" style="margin-top:12px;align-items:center">
      <button class="primary" id="gmBtn" onclick="gmToggle()">打开游戏模式</button>
      <span class="hint" id="gmAlert" style="color:#ff9f43"></span>
    </div>
    <label class="hint" style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-top:10px">
      <input type="checkbox" id="gmEmb" onchange="gmSaveEmb()" style="width:auto" checked>
      <span>也停掉本地 Embedding（<span id="pEmb">8912</span>，约 700MB 内存）——停了以后长期记忆的向量检索会失效</span>
    </label>
    <div class="hint" id="gmDetail" style="margin-top:10px"></div>
  </div>
  <div class="card">
    <div class="row">
      <button class="primary" onclick="act('/api/bot/online','正在上线…')">▶ 上线</button>
      <button class="danger" onclick="act('/api/bot/offline','正在下线…')">⏸ 下线</button>
      <button onclick="act('/api/bot/restart','正在重启 AstrBot…',true)">🔄 重启 AstrBot</button>
      <button onclick="act('/api/sl/restart','正在重启 SnowLuma…',true)">🛰 重启 SnowLuma</button>
    </div>
    <div class="hint">命令链路：QQ 客户端 → SnowLuma 注入 → OneBot WS(<span id="pOb">3001</span>) → AstrBot(<span id="pAstrWs">6199</span>)。下线会写 bot_off.flag 并结束 QQ/SnowLuma/AstrBot；重启 AstrBot 不掉 QQ 登录。</div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between"><b>机器人 QQ 实例</b>
      <span class="hint" id="qqListHint"></span>
    </div>
    <div class="hint" style="margin-top:8px">机器人 QQ 用独立的数据目录（config.json 里的 <code>qq_user_data_dir</code>）运行，和你自己的 QQ 互不干扰。SnowLuma 会注入这个实例，把它变成协议端。登录只能扫码。</div>
    <div class="row" style="margin-top:12px">
      <button class="primary" onclick="slHook()">启动 QQ 并挂载</button>
      <button onclick="act('/api/sl/hook','正在挂载…')">只挂载（QQ 已在运行）</button>
      <button onclick="slClick()">替它点登录</button>
      <button onclick="showQQ()">显示 QQ 窗口</button>
    </div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <b>扫码登录</b>
      <div class="row" style="gap:8px">
        <button onclick="loadQR(1)">重新截图</button>
        <button onclick="relogin()">重新登录（重开 QQ）</button>
      </div>
    </div>
    <div class="row" style="margin-top:12px;align-items:flex-start">
      <img class="qr" id="qr" alt="登录二维码" src="/api/sl/qr.png?t=0">
      <div class="hint" id="qrHint" style="max-width:340px">SnowLuma 没有二维码接口，所以这里显示的是从机器人 QQ 登录窗口截下来的图。已在线时不显示。“重新登录”会关掉机器人 QQ 重新拉起并截图（约 20 秒）。</div>
    </div>
  </div>`;
  refreshStatus(); loadQR(0); qqLoadCfg(); gmRefresh();
}
async function qqLoadCfg(){
  try{
    const a=await api('/api/qq/accounts');
    const list=a.list||[];
    if(list.length){ $('#qqListHint').textContent='SnowLuma 已识别账号：'+list.map(x=>x.uin+(x.nickname?'('+x.nickname+')':'')).join('、'); }
    else { $('#qqListHint').textContent='SnowLuma 没识别到已登录账号'; }
  }catch(e){}
}
async function slClick(){
  try{const r=await api('POST','/api/sl/click-login');toast(r.message||r.status);}catch(e){toast(''+e);}
  setTimeout(refreshAll,2500);
}
async function slHook(){
  toast('正在启动 QQ 并挂载，约 20 秒…');
  try{
    const r=await post('/api/sl/hook',{});
    toast(r.message||'完成', r.status==='ok'?'ok':'err');
    setTimeout(()=>{ loadQR(1); refreshStatus(); }, 1200);
  }catch(e){ toast('失败：'+e.message,'err'); }
}
async function showQQ(){
  toast('已请求显示 QQ 窗口');
  try{ await post('/api/sl/show',{}); }catch(e){}
}
let statusTimer=null;
async function refreshStatus(){
  clearTimeout(statusTimer);
  try{
    const s = await api('/api/status');
    const set=(i,ok,txt)=>{ $('#d'+i).className='dot'+(ok?' g':''); $('#v'+i).textContent=txt; };
    set(1,s.astrbot_up,s.astrbot_up?'运行中':'未运行');
    set(2,s.sl_up,s.sl_up?'运行中':'未运行');
    set(3,s.qq.isLogin,(s.qq.isLogin?'在线 ':'')+(s.qq.nickname||s.qq.state||''));
    set(4,s.dsh_running||s.watcher_pid,(s.dsh_running?'宿主开着':'宿主未开')+(s.watcher_pid?' · 监听中':(s.paused?' · 已手动下线':'')));
    const on = s.qq.isLogin;
    $('#sideState').textContent = on?'在线':'离线';
    $('#dotBot').className='dot'+(on?' g':'');
    $('#clock').textContent = s.time;
    if(s.owner_qq) window.__ownerQq = s.owner_qq;
    if(s.ports){const pp=(id,v)=>{const el=$('#'+id);if(el&&v)el.textContent=v;};
      pp('pAstr',s.ports.astrbot);pp('pAstrWs',s.ports.astrbot_ws);
      pp('pSl',s.ports.snowluma);pp('pOb',s.ports.onebot);pp('pEmb',s.ports.embed);}
    gmRefresh(s.game_mode);
    if(on){ const img=$('#qr'); if(img){ img.style.opacity=0; img.style.display='none'; } const h=$('#qrHint'); if(h) h.textContent='已在线（'+s.qq.nickname+'），无需扫码。'; }
    else { const img=$('#qr'); if(img) img.style.display=''; }
  }catch(e){}
  statusTimer=setTimeout(refreshStatus,5000);
}
let gmBusy=false, gmOn=false;
function gmPaint(st){
  if(!st) return;
  gmOn = !!st.enabled;
  const btn=$('#gmBtn'), sv=$('#gmState'), det=$('#gmDetail');
  if(btn){ btn.textContent = gmOn ? '关闭游戏模式' : '打开游戏模式'; btn.className = gmOn ? 'danger' : 'primary'; }
  if(sv){ sv.textContent = gmOn ? '已开启 · 语音已禁用' : '未开启'; sv.style.color = gmOn ? '#ff9f43' : ''; }
  const emb=$('#gmEmb'); if(emb){ emb.checked = st.stop_embedding!==false; }
  if(det){
    const bits=[];
    bits.push('肥鱼语音 '+(st.fy_up?'⚡还开着':'已停'));
    bits.push('CosyVoice2 '+(st.cv2_up?'⚡还开着':'已停'));
    bits.push('GPT-SoVITS '+(st.gsv_up?'⚡还开着':'已停'));
    bits.push('Embedding '+(st.embed_up?'还开着':'已停'));
    if(st.rvc_running) bits.push('RVC 还在跑');
    bits.push('语音总开关 '+(st.voice_master?'开':'关'));
    bits.push('唱歌总开关 '+(st.sing_master?'开':'关'));
    det.textContent = bits.join(' · ');
    const al=$('#gmAlert');
    if(al){
      const hot=[];
      if(st.fy_up) hot.push('肥鱼');
      if(st.cv2_up) hot.push('CosyVoice2');
      if(st.gsv_up) hot.push('GPT-SoVITS');
      if(st.stop_embedding!==false && st.embed_up) hot.push('Embedding');
      if(st.rvc_running) hot.push('RVC');
      al.textContent = (gmOn && hot.length) ? ('⚠ 还在跑：'+hot.join('、')+'（守卫 30 秒内会关掉）') : '';
    }
  }
}
async function gmRefresh(on){
  try{
    const st = await api('/api/game');
    gmPaint(st);
  }catch(e){ if(typeof on==='boolean') gmOn=on; }
}
async function gmToggle(){
  if(gmBusy) return; gmBusy=true;
  const btn=$('#gmBtn'); const old = btn?btn.textContent:'';
  if(btn){ btn.textContent='处理中…'; btn.disabled=true; }
  try{
    const r = await post('/api/game/toggle',{enabled:!gmOn});
    toast(r.message||'完成', r.status==='ok'?'ok':'err');
    gmPaint(r);
  }catch(e){ toast('失败：'+e.message,'err'); }
  finally{ gmBusy=false; if(btn){ btn.disabled=false; if(!$('#gmBtn').textContent||$('#gmBtn').textContent==='处理中…') btn.textContent=old; } }
}
async function gmSaveEmb(){
  const v=$('#gmEmb')?$('#gmEmb').checked:true;
  try{ const r=await post('/api/game/embedding',{stop_embedding:v}); toast(r.message||'已保存'); gmPaint(r); }
  catch(e){ toast('失败：'+e.message,'err'); }
}
async function relogin(){
  toast('正在重开机器人 QQ，约 20 秒…');
  try{
    const r=await post('/api/sl/relogin',{force:true});
    toast(r.message||'完成', r.status==='ok'?'ok':'err');
    setTimeout(()=>{ loadQR(1); refreshStatus(); }, 1500);
  }catch(e){ toast('失败：'+e.message,'err'); }
}
async function loadQR(force){
  const img=$('#qr'); if(!img) return;
  img.onerror=()=>{ img.style.opacity=.25; $('#qrHint').textContent='当前拿不到二维码（已登录，或 QQ 还没起来）。'; };
  img.onload=()=>{ img.style.opacity=1; };
  img.src='/api/sl/qr.png?t='+Date.now()+(force?'&force=1':'');
}
async function act(url,msg,slow){
  toast(msg);
  try{ const r=await post(url); toast(r.message||'完成', r.status==='ok'?'ok':'err'); }
  catch(e){ toast('失败：'+e.message,'err'); }
  if(slow) setTimeout(refreshStatus,3000); else setTimeout(refreshStatus,800);
}

async function saveTrigger(){

    scope:$('#mt_scope').value,
    semantic_top_k:parseInt($('#mt_topk').value||'5',10),

  };

async function loadMemes(){
  const d = await api('/api/memes');
  memeData=d;
  $('#memeCount').textContent = `共 ${d.total} 张 · ${Object.keys(d.categories).length} 个分类`;
  const cats=$('#cats'); if(!cats) return;
  const names=Object.keys(d.categories).sort((a,b)=>d.categories[b].length-d.categories[a].length);
  if(!curCat||!names.includes(curCat)) curCat=names[0]||null;
  cats.innerHTML=names.map(n=>`<div class="c ${n===curCat?'on':''}" data-c="${esc(n)}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n)}</span><span>${d.categories[n].length}</span></div>`).join('')||'<div style="padding:10px;color:var(--dim)">没有分类</div>';
  cats.querySelectorAll('.c').forEach(el=>el.onclick=()=>{curCat=el.dataset.c;loadMemes()});
  renderThumbs();
}
function renderThumbs(){
  $('#curTitle').textContent = curCat||'—';
  $('#curDesc').textContent = (memeData.descriptions[curCat]||'（无描述）');
  const files = (memeData.categories[curCat]||[]);
  $('#thumbs').innerHTML = files.map(f=>`<div class="thumb"><img loading="lazy" src="/api/memes/img?category=${encodeURIComponent(curCat)}&filename=${encodeURIComponent(f)}"><button class="del" title="删除" onclick="delImg('${esc(f)}')">✕</button></div>`).join('')||'<div class="hint">这个分类还没有图，拖图片进来即可。</div>';
  $('#curDesc').onclick=()=>editDesc();
  $('#curDesc').title='点击修改描述';
}
async function uploadFiles(files){
  if(!curCat) return toast('先选一个分类','err');
  const imgs = files.filter(f=>/^image\//.test(f.type));
  if(!imgs.length) return toast('不是图片文件','err');
  toast(`上传 ${imgs.length} 张到「${curCat}」…`);
  let ok=0;
  for(const f of imgs){
    const fd=new FormData(); fd.append('file',f);
    try{
      const r=await fetch('/api/memes/upload?category='+encodeURIComponent(curCat),{method:'POST',body:fd});
      const j=await r.json();
      if(r.ok && (j.status==='ok'||j.message?.includes('成功'))) ok++;
    }catch(e){}
  }
  toast(`已上传 ${ok}/${imgs.length} 张`, ok?'ok':'err');
  loadMemes();
}
async function delImg(f){
  if(!confirm('删除这张表情？')) return;
  await post('/api/memes/delete',{category:curCat,filename:f});
  toast('已删除','ok'); loadMemes();
}
async function newCat(){
  const name=prompt('新分类名（英文/拼音更稳，如 happy2）'); if(!name) return;
  const desc=prompt('分类描述（会告诉模型什么时候用这个分类）','')||'';
  const r=await post('/api/memes/category',{category:name,description:desc});
  toast(r.message||'已创建', r.status==='ok'?'ok':'err');
  curCat=name; loadMemes();
}
async function editDesc(){
  if(!curCat) return;
  const d=prompt('「'+curCat+'」的分类描述',memeData.descriptions[curCat]||'');
  if(d===null) return;
  const r=await post('/api/memes/category',{category:curCat,description:d});
  toast(r.message||'已保存', r.status==='ok'?'ok':'err'); loadMemes();
}
async function delCat(){
  if(!curCat) return;
  if(!confirm(`删除分类「${curCat}」及其所有图片？此操作不可撤销。`)) return;
  await post('/api/memes/category/delete',{category:curCat});
  toast('已删除分类','ok'); curCat=null; loadMemes();
}

async function viewModel(){
  $('#main').innerHTML=`<h2>模型 <span class="sub">当前生效的对话模型</span></h2><div id="provs">加载中…</div>`;
  const d=await api('/api/providers');
  const items=d.items||[];
  $('#provs').innerHTML=items.map(p=>`
    <div class="card">
      <div class="row" style="justify-content:space-between">
        <div><b>${esc(p.id)}</b> <span class="hint">${esc(p.type||'')}</span></div>
        <button class="${p.enable?'primary':''}" onclick="setActive('${esc(p.id)}')">${p.enable?'✓ 使用中':'设为当前'}</button>
      </div>
      <label class="f">模型名 model</label><input value="${esc(p.model||'')}" data-id="${esc(p.id)}" data-k="model">
      <label class="f">接口地址 api_base</label><input value="${esc(p.api_base||'')}" data-id="${esc(p.id)}" data-k="api_base">
      <label class="f">API Key（留空=不改）</label><input placeholder="${esc(p.key_masked||'')}" data-id="${esc(p.id)}" data-k="key">
      <label class="f">思考强度（推理力度，越强越慢越费）</label>
      <select data-id="${esc(p.id)}" data-k="thinking" onchange="saveThink('${esc(p.id)}',this.value)">
        ${thinkOpts(p.thinking)}
      </select>
      <div class="hint" style="margin-top:6px">${thinkHint(p.thinking)}</div>
      <div class="row" style="margin-top:10px"><button onclick="saveProv('${esc(p.id)}')">保存这个模型</button></div>
    </div>`).join('')||'<div class="hint">没有配置模型</div>';
}
const THINK_LABELS={off:'关闭思考（最快最省）',low:'低',medium:'中',high:'高',max:'最高（最慢最贵）','':'跟随模型默认'};
function thinkOpts(cur){
  const order=['','off','low','medium','high','max'];
  return order.map(v=>`<option value="${v}" ${String(cur||'')===v?'selected':''}>${THINK_LABELS[v]}</option>`).join('');
}
function thinkHint(cur){
  const m={
    off:'不发思考请求体，响应最快、token 最省，适合日常闲聊',
    low:'想一两步就回答，速度和质量的折中',
    medium:'中等推理，多数场景够用',
    high:'深想，回答更稳但更慢更贵',
    max:'最大推理预算，只在难题上开',
    '':'不写任何参数，沿用服务端/模型自己的默认'
  };
  return m[String(cur||'')]||'';
}
async function saveThink(id,level){
  const r=await post('/api/providers/thinking',{id,level});
  toast(r.message||'已保存', r.status==='ok'?'ok':'err');
  if(r.status==='ok') viewModel();
}
async function setActive(id){ const r=await post('/api/providers/active',{id}); toast(r.message||'已切换', r.status==='ok'?'ok':'err'); viewModel(); }
async function saveProv(id){
  const g=k=>document.querySelector(`input[data-id="${id}"][data-k="${k}"]`).value.trim();
  const r=await post('/api/providers/save',{id,model:g('model'),api_base:g('api_base'),key:g('key')});
  toast(r.message||'已保存', r.status==='ok'?'ok':'err'); viewModel();
}

async function qFeed(){

  try{
    const d=await api('/api/qzone/feed?page=1');

function tkSet(d){ tkDays=d; [1,3,7].forEach(n=>$('#tk'+n).className=n===d?'primary':''); loadTokens(); }
const fmtNum=n=>{ n=Number(n||0); if(n>=1e8)return (n/1e8).toFixed(2)+' 亿'; if(n>=1e4)return (n/1e4).toFixed(1)+' 万'; return n.toLocaleString(); };
async function loadTokens(){

function tkPct(x){ return x==null? '—' : (x*100).toFixed(1)+'%'; }

let pItems=[], pCfg={};
async function viewParams(){
  $('#main').innerHTML=`<h2>参数调整 <span class="sub">保存后 AstrBot 热更新，多数立即生效</span></h2>
  <div class="card"><div class="row" style="justify-content:space-between"><b>对话与回复</b><button class="primary" onclick="saveParams()">保存</button></div><div id="pform" style="margin-top:6px" class="hint">加载中…</div></div>

    </div>

  </div>`;
  const d=await api('/api/params');
  pItems=d.items||[]; pCfg={};
  pItems.forEach(it=>pCfg[it.path]=it.value);

  $('#pform').innerHTML=pItems.map(it=>{
    const id='p_'+it.path.replace(/\./g,'_');

    if(it.type==='bool'){
      input=`<select id="${id}" data-path="${it.path}"><option value="1" ${it.value?'selected':''}>开启</option><option value="0" ${it.value?'':'selected'}>关闭</option></select>`;
    }else if(it.type==='choice'){
      input=`<select id="${id}" data-path="${it.path}">${(it.choices||[]).map(c=>`<option ${it.value===c?'selected':''}>${c}</option>`).join('')}</select>`;
    }else if(it.type==='int'){
      input=`<input id="${id}" data-path="${it.path}" type="number" value="${it.value??''}">`;
    }else if(it.type==='list'){
      input=`<input id="${id}" data-path="${it.path}" value="${esc((it.value||[]).join(', '))}">`;
    }else{
      input=`<input id="${id}" data-path="${it.path}" value="${esc(it.value??'')}">`;
    }
    return `<div class="prow"><div><div class="plabel">${esc(it.label)}</div><div class="hint">${esc(it.hint||it.path)}</div></div><div class="pinput">${input}</div></div>`;
  }).join('');
  const ps=$('#pPlug'); ps.innerHTML=(d.plugins||[]).map(n=>`<option>${n}</option>`).join('');

}
async function saveParams(){
  const values={};
  document.querySelectorAll('#pform [data-path]').forEach(el=>{
    const p=el.dataset.path; const it=pItems.find(x=>x.path===p)||{};
    let v=el.value;
    if(it.type==='bool') v = v==='1';
    else if(it.type==='int') v = parseInt(v||'0',10);
    else if(it.type==='list') v = v.split(',').map(s=>s.trim()).filter(Boolean);
    values[p]=v;
  });
  toast('保存中…');
  const r=await post('/api/params',{values});
  toast(r.message||'已保存', r.status==='ok'?'ok':'err');
}
function flatten(obj,prefix,out,depth){
  if(depth>4||out.length>80) return out;
  Object.keys(obj||{}).forEach(k=>{
    const v=obj[k], p=prefix?prefix+'.'+k:k;
    if(v&&typeof v==='object'&&!Array.isArray(v)) flatten(v,p,out,depth+1);
    else if(Array.isArray(v)) out.push({path:p,value:v.join(', '),type:'list'});
    else out.push({path:p,value:v,type:typeof v});
  });
  return out;
}
async function loadPluginCfg(){
  const name=$('#pPlug').value; const box=$('#pform2');
  if(!name) return;
  box.textContent='加载中…'; box.className='hint';
  const d=await api('/api/plugin-config?name='+encodeURIComponent(name));
  if(d.status!=='ok'){ box.textContent=d.message||'读取失败'; return; }
  const flat=flatten(d.config||{},'',[],0);
  box.className='';
  box.innerHTML=flat.map(f=>{
    const id='q_'+f.path.replace(/[^a-zA-Z0-9]/g,'_');
    let input;
    if(typeof f.value==='boolean')
      input=`<select id="${id}" data-path="${f.path}" data-t="bool"><option value="1" ${f.value?'selected':''}>开启</option><option value="0" ${f.value?'':'selected'}>关闭</option></select>`;
    else if(typeof f.value==='number')
      input=`<input id="${id}" data-path="${f.path}" data-t="num" type="number" step="any" value="${f.value}">`;
    else
      input=`<input id="${id}" data-path="${f.path}" data-t="${f.type==='list'?'list':'str'}" value="${esc(f.value??'')}">`;
    return `<div class="prow"><div><div class="plabel">${esc(f.path)}</div></div><div class="pinput">${input}</div></div>`;
  }).join('')||'<div class="hint">这个插件没有可改的参数</div>';
}
async function savePluginCfg(){
  const name=$('#pPlug').value; if(!name) return;
  const d=await api('/api/plugin-config?name='+encodeURIComponent(name));
  const cfg=d.config||{};
  document.querySelectorAll('#pform2 [data-path]').forEach(el=>{
    const path=el.dataset.path, t=el.dataset.t; let v=el.value;
    if(t==='bool') v = v==='1';
    else if(t==='num') v = Number(v||0);
    else if(t==='list') v = v.split(',').map(s=>s.trim()).filter(Boolean);
    const ks=path.split('.'); let cur=cfg;
    for(let i=0;i<ks.length-1;i++){ if(typeof cur[ks[i]]!=='object'||cur[ks[i]]===null) cur[ks[i]]={}; cur=cur[ks[i]]; }
    cur[ks[ks.length-1]]=v;
  });
  toast('保存中…');
  const r=await post('/api/plugin-config?name='+encodeURIComponent(name),{config:cfg});
  toast(r.message||'已保存', r.status==='ok'?'ok':'err');
}

function pcRender(box, name, cfg){
  const flat=flatten(cfg||{},'',[],0);
  box.className='';
  box.innerHTML=flat.map(f=>{
    const id='pc_'+name+'_'+f.path.replace(/[^a-zA-Z0-9]/g,'_');
    let input;
    if(typeof f.value==='boolean')
      input=`<select id="${id}" data-path="${f.path}" data-t="bool"><option value="1" ${f.value?'selected':''}>开启</option><option value="0" ${f.value?'':'selected'}>关闭</option></select>`;
    else if(typeof f.value==='number')
      input=`<input id="${id}" data-path="${f.path}" data-t="num" type="number" step="any" value="${f.value}">`;
    else
      input=`<input id="${id}" data-path="${f.path}" data-t="${f.type==='list'?'list':'str'}" value="${esc(f.value??'')}">`;
    return `<div class="prow"><div class="plabel">${esc(f.path)}</div><div class="pinput">${input}</div></div>`;
  }).join('')||'<div class="hint">没有可改的参数</div>';
}
async function pcLoad(name, boxId){
  const box=document.getElementById(boxId); if(!box) return;
  box.textContent='读取中…'; box.className='hint';
  try{
    const d=await api('/api/plugin-config?name='+encodeURIComponent(name));
    if(d.status!=='ok'){ box.textContent=d.message||'读取失败'; return; }
    pcRender(box, name, d.config);
  }catch(e){ box.textContent='读取失败：'+e.message; }
}
async function pcSave(name, boxId){
  const box=document.getElementById(boxId); if(!box) return;
  const d=await api('/api/plugin-config?name='+encodeURIComponent(name));
  const cfg=d.config||{};
  box.querySelectorAll('[data-path]').forEach(el=>{
    const path=el.dataset.path, t=el.dataset.t; let v=el.value;
    if(t==='bool') v = v==='1';
    else if(t==='num') v = Number(v||0);
    else if(t==='list') v = v.split(',').map(x=>x.trim()).filter(Boolean);
    const ks=path.split('.'); let cur=cfg;
    for(let i=0;i<ks.length-1;i++){ if(typeof cur[ks[i]]!=='object'||cur[ks[i]]===null) cur[ks[i]]={}; cur=cur[ks[i]]; }
    cur[ks[ks.length-1]]=v;
  });
  toast('保存中…');
  const r=await post('/api/plugin-config?name='+encodeURIComponent(name),{config:cfg});
  toast(r.message||'已保存', r.status==='ok'?'ok':'err');
}

async function paLoad(){

    $('#pa_lmp').value=c.join_punct||'，';
    paLineModeUI();
    const today = st.date===new Date().toISOString().slice(0,10) ? (st.count||0) : 0;
    let msg = `今日已发 <b>${today}</b>${c.daily_limit>0?' / '+c.daily_limit:'（不限）'} 条`;
    if(live.last_text) msg += ` · 最近一条：${esc(live.last_text.slice(0,80))}`;

async function paLoadSessions(){  const el=$('#pa_sess'); if(!el) return;
  try{
    const d=await api('/api/proactive/sessions');
    if(d.status==='error'){ el.textContent='读取失败：'+(d.message||''); return; }
    const rows=(d.sessions||[]).map(s=>{
      const when=s.last_sent? new Date(s.last_sent*1000).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '还没发过';
      const cnt=s.max_unanswered>0? `${s.unanswered} / ${s.max_unanswered}` : `${s.unanswered}`;
      const flag=s.blocked? ' <b style="color:#e0a33e">已暂停（等回复）</b>' : '';
      return `<div style="margin:4px 0"><code>${esc(s.umo)}</code> · 未回复 <b>${cnt}</b> · 上次 ${when}${flag}</div>`;
    }).join('');
    let next='';
    if(d.next_ts){
      const t=new Date(d.next_ts*1000);
      next=`<div style="margin-top:6px">下次约 <b>${t.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}</b></div>`;
    }
    el.innerHTML=(rows||'<div>还没有记录（她还没主动发过消息）</div>')+next;
  }catch(e){ el.textContent='读取失败：'+e.message; }
}

async function lmGraph(){
  try{
    const d=await api('/api/livingmemory/graph');
    const g=d.graph||{};
    const s=g.summary||{};
    const lines=[];
    if(s.graph_memory_enabled===false) lines.push('<b style="color:#e0a33e">图记忆未开启</b>（插件面板 → 设置 → 图记忆 里打开）');
    lines.push(`节点 <b>${s.graph_node_count??0}</b> · 边 <b>${s.graph_edge_count??0}</b> · 图条目 <b>${s.graph_entry_count??0}</b>`);
    const nb=s.node_type_breakdown||{}, rb=s.relation_breakdown||{};
    const nk=Object.keys(nb), rk=Object.keys(rb);
    if(nk.length) lines.push('节点类型：'+nk.map(k=>esc(k)+' '+nb[k]).join(' · '));
    if(rk.length) lines.push('关系：'+rk.map(k=>esc(k)+' '+rb[k]).join(' · '));
    if(d.warning) lines.push(esc(d.warning));
    $('#lm_graph').innerHTML=lines.join('<br>');
  }catch(e){ $('#lm_graph').textContent='读取失败：'+e.message; }
}
async function lmRebuild(){
  const box=$('#lm_graph');
  box.innerHTML='重建中…（记忆多时可能要一两分钟，别关页面）';
  try{
    const d=await post('/api/livingmemory/graph/rebuild',{});
    const r=d.data||d||{};
    if(d.status==='error'){ box.innerHTML='<b style="color:#e5534b">'+esc(d.message||'重建失败')+'</b>'; return; }
    await lmGraph();
    box.innerHTML='<b style="color:#3fb950">已重建：'+ (r.rebuilt??0) +' 条，跳过 '+ (r.skipped??0) +' 条</b><br>'+box.innerHTML;

}
async function lmPage(delta){

function lmRender(d){
  const data=d.data||d||{};
  const items=data.memories||data.items||data.list||[];
  if(!Array.isArray(items)||!items.length){ $('#lm_list').innerHTML='<div>暂无记忆</div>'; return; }
  $('#lm_list').innerHTML=items.map(m=>{
    const txt=String(m.content||m.summary||m.text||'').slice(0,300);
    const imp=m.importance!=null? Number(m.importance).toFixed(1):'';
    const st=m.status||'';
    return `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
      <div style="color:#c9d1d9">${esc(txt)}</div>
      <div class="hint" style="margin-top:4px">${m.session_id?'<code>'+esc(String(m.session_id))+'</code> · ':''}${imp?'重要度 '+imp+' · ':''}${st?esc(st):''}</div>

  }).join('');
}
async function lmLoad(){
  try{

    const lines=[];

    if(s.avg_importance!=null) lines.push(`平均重要度 <b>${Number(s.avg_importance).toFixed(2)}</b>`);
    if(s.sessions) lines.push(`会话数 <b>${Object.keys(s.sessions).length}</b>`);
    const ix=s.index_maintenance;
    if(ix&&ix.state&&ix.state!=='ok') lines.push(`<b style="color:#e0a33e">索引：${esc(ix.state)} — ${esc(ix.message||ix.reason||'')}</b>`);

function monRender(d){

  const last = d.last_check ? new Date(d.last_check*1000).toLocaleTimeString() : '—';

  const st = $('#monStatus');
  if(st){
    st.innerHTML = `
      <div class="row" style="justify-content:space-between"><b>当前状态</b><span class="dim">上次检查 ${last}</span></div>
      <div style="margin-top:10px;line-height:2">

        <div>${okDot(d.astrbot_ok)} AstrBot 服务 ${d.astrbot_ok?'正常':'<b style="color:#e35">异常</b>'}</div>
        <div>${okDot(d.sl_up)} SnowLuma 服务 ${d.sl_up?'正常':'没起来'}</div>
      </div>
      ${!d.qq_ok && d.down_since ? `<div class="hint" style="margin-top:8px;color:#e9a">已经掉线约 ${downMin} 分钟</div>` : ''}`;
  }
  const qr = $('#monQr');
  if(qr){
    if(!d.qq_ok){
      qr.innerHTML = `<b>QQ 掉线了，扫下面这张码就能登回去</b>
        <div class="hint" style="margin-top:6px">二维码是从机器人 QQ 登录窗口截的${d.qr_age>=0?'，'+d.qr_age+' 秒前更新':''}。手机 QQ → 扫一扫。扫完这里会自动变绿。</div>
        <div style="margin-top:12px" class="qrbox"><img class="qr" src="/api/monitor/qr?_=${d.qr_mtime||0}" onerror="this.parentNode.innerHTML='<span class=dim>暂无二维码，点上面「看登录二维码」或回概览点重新登录</span>'"></div>`;
    } else {
      qr.innerHTML = `<b>一切正常</b><div class="hint" style="margin-top:6px">掉线时会自动把二维码显示在这里，同时弹 Windows 通知。</div>`;
    }
  }
  const bar = $('#alertBar');
  if(bar){
    if(d.qq_ok===false){
      bar.style.display='flex';
      bar.innerHTML = `<b>QQ 掉线</b><span>SnowLuma 的 OneBot 或 QQ 进程没起来，点这里看二维码扫码登录</span>`;
    } else { bar.style.display='none'; }
  }
}

async function voCv2(act, btn){
  const msg = $('#vo_cv2_msg');
  btn.disabled = true;
  msg.textContent = act === 'stop' ? '正在停止…' : '正在启动，模型加载约 40~60 秒…';
  try{
    const d = await api('/api/voice/cv2/' + act, {method:'POST', body:{}});
    msg.textContent = d.message || '已下发';
  }catch(e){ msg.textContent = '失败：' + e; }
  btn.disabled = false;
  // 起服务时模型加载要几十秒，轮询刷新状态直到就绪
  let n = 0;
  const timer = setInterval(async ()=>{
    n++;
    try{
      const d = await api('/api/voice');
      const cl = d.clone || {};
      const st = $('#vo_clone_state');
      if (cl.up && cl.loaded) { st.textContent = '✅ CosyVoice2 在线，已加载模型'; msg.textContent = '已就绪'; clearInterval(timer); }
      else if (cl.up) { st.textContent = '⏳ CosyVoice2 在线，模型加载中…'; }
      else if (act === 'stop') { st.textContent = '⏹ CosyVoice2 已停止'; clearInterval(timer); }
    }catch(e){}
    if (n > 24) clearInterval(timer);
  }, 5000);
}

  if(btn) btn.disabled = false;
}

function sgMixLabel(){
  const v = parseFloat($('#mx_vocal').value)||0;
  const i = parseFloat($('#mx_inst').value)||0;
  const f = x => (x>0?'+':'') + x.toFixed(1) + ' dB';
  if($('#mx_vlbl')) $('#mx_vlbl').textContent = f(v);
  if($('#mx_ilbl')) $('#mx_ilbl').textContent = f(i);
}
async function sgLoadMix(){
  try{
    const d = await api('/api/sing/mix');
    const c = d.config||{};
    if($('#mx_vocal')) $('#mx_vocal').value = c.vocal_db||0;
    if($('#mx_inst')) $('#mx_inst').value = c.inst_db||0;
    sgMixLabel();
    if(d.preview){
      const a = $('#mx_audio');
      if(a){ a.style.display=''; a.src = '/api/sing/mixaudio?v=' + Date.now(); }
    }
  }catch(e){}
}
async function sgRemix(btn){
  if(btn) btn.disabled = true;
  const m = $('#mx_msg');
  if(m) m.textContent = '混音中…';
  try{
    const r = await api('/api/sing/mix',{method:'POST',body:JSON.stringify({
      vocal_db: parseFloat($('#mx_vocal').value)||0,
      inst_db: parseFloat($('#mx_inst').value)||0,
    })});
    const r2 = await api('/api/sing/remix',{method:'POST',body:'{}'});
    if(m) m.textContent = r2.message||r2.status;
    toast(r2.message||r2.status, r2.status==='ok'?'good':'bad');
    if(r2.status==='ok'){
      const a = $('#mx_audio');
      if(a){ a.style.display=''; a.src = '/api/sing/mixaudio?v=' + Date.now(); a.load(); a.play().catch(()=>{}); }
    }
  }catch(e){ if(m) m.textContent = '失败：'+e; toast('失败：'+e,'bad'); }
  if(btn) btn.disabled = false;
}
async function sgMixReset(btn){
  if($('#mx_vocal')) $('#mx_vocal').value = 0;
  if($('#mx_inst')) $('#mx_inst').value = 0;
  sgMixLabel();
  await sgRemix(btn);
}
async function sgSaveMaster(btn){
  if(btn) btn.disabled = true;
  try{
    const r = await api('/api/voice',{method:'POST',body:JSON.stringify({sing_master: $('#sg_master').checked})});
    toast(r.message||r.status, r.status==='ok'?'good':'bad');
    if(r.status==='ok'){
      const card = $('#sg_master_card');
      if(card) card.style.borderColor = ($('#sg_master').checked ? '#2f6b46' : '#7a3b3b');
    }
  }catch(e){ toast('失败：'+e,'bad'); }
  if(btn) btn.disabled = false;
}
async function sgLoadCfg(){
  try{
    const d = await api('/api/voice');
    const c = d.config||{};
    if($('#sg_master')) $('#sg_master').checked = c.sing_master !== false;
    if($('#sg_master_card')) $('#sg_master_card').style.borderColor = (c.sing_master===false?'#7a3b3b':'#2f6b46');
    if($('#sg_on')) $('#sg_on').checked = c.sing_enable !== false;
    if($('#sg_group')) $('#sg_group').checked = c.sing_in_group !== false;
    if($('#sg_private')) $('#sg_private').checked = c.sing_in_private !== false;
    if($('#sg_cool')) $('#sg_cool').value = c.sing_cooldown||0;
  }catch(e){}
}
async function sgSaveCfg(btn){
  if(btn) btn.disabled = true;
  try{
    const r = await api('/api/voice',{method:'POST',body:JSON.stringify({
      sing_enable: $('#sg_on').checked,
      sing_in_group: $('#sg_group').checked,
      sing_in_private: $('#sg_private').checked,
      sing_cooldown: parseInt($('#sg_cool').value||'0',10),
    })});
    if($('#sg_cfgmsg')) $('#sg_cfgmsg').textContent = r.message||r.status;
    toast(r.message||r.status, r.status==='ok'?'good':'bad');
  }catch(e){ toast('保存失败：'+e,'bad'); }
  if(btn) btn.disabled = false;
}
let sgTimer = null;
async function sgPoll(){
  clearTimeout(sgTimer);
  let d=null;
  try{ d = await api('/api/sing/status'); }catch(e){}
  const st = (d&&d.state)||{};
  const stage = $('#sg_stage'), log = $('#sg_log');
  if(stage){
    if(st.running) stage.textContent = (st.stage||'进行中') + ' …' + (st.query?('（'+st.query+'）'):'');
    else if(st.stage==='完成') stage.textContent = '✅ 完成';
    else if(st.stage==='失败') stage.textContent = '❌ 失败：' + (st.error||'');
    else stage.textContent = '还没开始';
  }
  if(log) log.textContent = st.log||'';
  const res = $('#sg_result');
  if(res){
    if(st.out && st.size){
      res.style.display='';
      const au = $('#sg_audio');
      const url = '/api/sing/audio?v=' + (st.mtime||0);
      if(au.getAttribute('src')!==url){ au.setAttribute('src', url); }
      const kb = Math.round((st.size||0)/1024);
      const sec = st.started&&st.finished?(st.finished-st.started):0;
      $('#sg_info').textContent = st.out.split(/[\\/]/).pop() + ' · ' + kb + ' KB · 耗时 ' + sec + ' 秒';
    } else {
      res.style.display='none';
    }
  }
  if(st.running) sgTimer = setTimeout(sgPoll, 3000);
}
async function sgSearch(btn){
  const q = $('#sg_q').value.trim();
  if(!q) return toast('先填歌名','bad');
  const box = $('#sg_hits');
  box.textContent = '搜索中…';
  try{
    const d = await api('/api/sing/search?q=' + encodeURIComponent(q));
    const list = d.list||[];
    if(!list.length){ box.textContent = '没搜到，换个关键词或直接填歌曲 ID'; return; }
    box.innerHTML = list.map(it=>`<div style="padding:6px 0;border-bottom:1px solid var(--line)">
      <a href="javascript:void(0)" onclick="sgPick('${it.id}','${esc(it.song||'')}')">${esc(it.song||'')}</a>
      <span class="hint"> — ${esc(it.singer||'')}</span></div>`).join('');
  }catch(e){ box.textContent = '搜索失败：'+e; }
}
function sgPick(id, song){
  $('#sg_id').value = id;
  if(song) $('#sg_q').value = song;
  toast('已选中：'+song,'good');
}
async function sgStart(btn){
  const query = $('#sg_q').value.trim();
  const song_id = $('#sg_id').value.trim();
  if(!query && !song_id) return toast('填歌名或歌曲 ID','bad');
  btn.disabled = true;
  try{
    const d = await post('/api/sing/start', {query, song_id});
    toast(d.message||d.status, d.status==='ok'?'good':'bad');
  }catch(e){ toast('启动失败：'+e,'bad'); }
  btn.disabled = false;
  sgPoll();
}
async function sgStop(btn){
  await post('/api/sing/stop', {});
  toast('已请求中止','');
  sgPoll();
}
const views={home:viewHome,meme:viewMeme,persona:viewPersona,model:viewModel,groups:viewGroups,proactive:viewProactive,memory:viewMemory,tokens:viewTokens,params:viewParams,qzone:viewQzone,monitor:viewMonitor,voice:viewVoice,sing:viewSing,extras:viewExtras,log:viewLog};
function go(t){
  clearTimeout(statusTimer); clearTimeout(logTimer); clearInterval(monTimer);
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===t));
  location.hash=t;
  views[t]();
}
$('#nav').onclick=e=>{ const a=e.target.closest('a'); if(a) go(a.dataset.t); };
go(location.hash.replace('#','')||'home');
</script>
